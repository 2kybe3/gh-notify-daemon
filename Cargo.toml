[package]
name = "gh-notify-daemon"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.50.0", features = [
  "rt-multi-thread",
  "macros",
  "time",
  "fs",
] }
serde = { version = "1.0.228", features = ["derive"] }
chrono = { version = "0.4.44", features = ["serde"] }
notify-rust = "4.12.0"
serde_json = "1.0.149"
reqwest = "0.13.2"
